<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log-Normal Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-7xl px-4 py-10">
      <header class="mb-8">
        <h1 class="text-2xl font-semibold tracking-tight">Log-Normal Planner</h1>
        <p class="mt-1 text-sm text-slate-500">Add tasks, then pick a mode and P<sub>90</sub> in hours.</p>
      </header>

      <section class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <div id="tasks-heading" class="border-b border-slate-100 px-4 py-3">
          <h2 class="text-sm font-medium text-slate-700">Tasks</h2>
        </div>

        <div
          id="column-headers"
          class="hidden grid items-center gap-x-8 border-b border-slate-100 px-4 py-2 text-xs font-medium text-slate-500 [grid-template-columns:minmax(28rem,1fr)_auto_auto]"
        >
          <span class="border-r border-slate-100 pr-6 text-sm font-medium text-slate-700">Tasks</span>
          <div class="flex gap-8">
            <span class="w-[15.5rem]">Mode</span>
            <span class="w-[15.5rem]">P<sub>90</sub></span>
          </div>
          <span class="w-10 border-l border-slate-100 pl-3">
            <span class="sr-only">Actions</span>
          </span>
        </div>

        <ul id="task-list" class="divide-y divide-slate-100"></ul>

        <div id="add-task-footer" class="flex items-center justify-between gap-3 border-t border-slate-100 px-4 py-3">
          <button
            id="add-task-bottom"
            type="button"
            class="hidden rounded-md bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
          >
            Add task
          </button>
          <p id="usage" class="ml-auto text-sm tabular-nums text-slate-500">0 bytes</p>
        </div>

        <button
          id="empty-state"
          type="button"
          class="m-4 w-[calc(100%-2rem)] rounded-lg border border-dashed border-slate-300 px-4 py-8 text-center text-sm text-slate-600 hover:border-slate-400 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
        >
          + Add a task to get started
        </button>
      </section>

      <div
        id="undo-toast"
        role="status"
        aria-live="polite"
        class="mt-3 hidden items-center justify-between rounded-lg bg-slate-900 px-4 py-2 text-sm text-slate-100 shadow-sm"
      >
        <span id="undo-message">Task deleted.</span>
        <button
          id="undo-delete"
          type="button"
          class="rounded-md bg-white px-2.5 py-1 text-sm font-medium text-slate-900 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        >
          Undo
        </button>
      </div>

      <section class="mt-8 rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
          <h2 class="text-sm font-medium text-slate-700">Simulation</h2>
          <button
            id="resimulate"
            type="button"
            class="rounded-md bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:bg-slate-300 disabled:hover:bg-slate-300"
          >
            Re-simulate
          </button>
        </div>
        <div class="flex flex-wrap items-center gap-4 px-4 py-3">
          <label for="runs-slider" class="text-sm text-slate-600">
            Runs
            <span id="runs-label" class="ml-1 font-medium tabular-nums text-slate-900">10,000</span>
          </label>
          <input
            id="runs-slider"
            type="range"
            min="500"
            max="10000"
            step="500"
            value="10000"
            class="min-w-48 flex-1 accent-slate-900"
          />
        </div>
      </section>

      <section class="mt-4 rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-100 px-4 py-3">
          <h2 class="text-sm font-medium text-slate-700">Graph</h2>
        </div>
        <p id="output-status" class="px-4 pt-4 text-sm text-slate-500"></p>
        <div id="output-stats" class="hidden flex flex-wrap gap-2 px-4 pt-3">
          <div data-stat="sum-mode" class="inline-flex h-8 items-center gap-2 rounded-md bg-slate-100 px-2.5">
            <span class="text-xs font-medium text-slate-500">Sum of modes</span>
            <span id="stat-sum-mode" class="text-sm font-medium tabular-nums text-slate-900">—</span>
          </div>
          <div data-stat="sum-p90" class="inline-flex h-8 items-center gap-2 rounded-md bg-slate-100 px-2.5">
            <span class="text-xs font-medium text-slate-500">Sum of P<sub>90</sub>s</span>
            <span id="stat-sum-p90" class="text-sm font-medium tabular-nums text-slate-900">—</span>
          </div>
          <div data-stat="sim-mode" class="inline-flex h-8 items-center gap-2 rounded-md bg-blue-50 px-2.5">
            <span class="text-xs font-medium text-blue-700">Simulated mode</span>
            <span id="stat-sim-mode" class="text-sm font-medium tabular-nums text-blue-800">—</span>
          </div>
          <div data-stat="sim-p90" class="inline-flex h-8 items-center gap-2 rounded-md bg-red-50 px-2.5">
            <span class="text-xs font-medium text-red-700">Simulated P<sub>90</sub></span>
            <span id="stat-sim-p90" class="text-sm font-medium tabular-nums text-red-800">—</span>
          </div>
        </div>
        <div id="histogram-wrap" class="hidden h-80 px-4 pb-4">
          <canvas id="histogram" class="h-full w-full"></canvas>
        </div>
      </section>
    </main>

    <script>
      const taskListEl = document.getElementById("task-list");
      const tasksHeadingEl = document.getElementById("tasks-heading");
      const columnHeadersEl = document.getElementById("column-headers");
      const emptyStateEl = document.getElementById("empty-state");
      const addTaskBottomBtn = document.getElementById("add-task-bottom");
      const usageEl = document.getElementById("usage");
      const undoToastEl = document.getElementById("undo-toast");
      const undoMessageEl = document.getElementById("undo-message");
      const undoDeleteBtn = document.getElementById("undo-delete");
      const resimulateBtn = document.getElementById("resimulate");
      const runsSliderEl = document.getElementById("runs-slider");
      const runsLabelEl = document.getElementById("runs-label");
      const outputStatusEl = document.getElementById("output-status");
      const outputStatsEl = document.getElementById("output-stats");
      const statSumModeEl = document.getElementById("stat-sum-mode");
      const statSumP90El = document.getElementById("stat-sum-p90");
      const statSimModeEl = document.getElementById("stat-sim-mode");
      const statSimP90El = document.getElementById("stat-sim-p90");
      const histogramEl = document.getElementById("histogram");
      const histogramWrapEl = document.getElementById("histogram-wrap");

      const MODE_HOURS = [1, 2, 3, 5, 8, 13];
      const P90_HOURS = [1, 2, 3, 5, 8, 13, 21];
      const DEFAULT_RUNS = 10000;
      const Z90 = 1.2815515655446004;

      const focusRing =
        "focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900";
      const focusRingOnDark =
        "focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white";

      let nextId = 1;
      let tasks = [];
      let runs = DEFAULT_RUNS;
      let undo = null;
      let applyingHash = false;
      let histogramChart = null;

      function bytesToBase64Url(bytes) {
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function base64UrlToBytes(value) {
        const padded = value.replace(/-/g, "+").replace(/_/g, "/");
        const pad = padded.length % 4 === 0 ? "" : "=".repeat(4 - (padded.length % 4));
        const binary = atob(padded + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function nearestHour(value, series) {
        const n = Number(value);
        if (series.includes(n)) return n;
        return series.reduce((best, hour) =>
          Math.abs(hour - n) < Math.abs(best - n) ? hour : best,
        );
      }

      function largestAtMost(value, series) {
        const allowed = series.filter((hour) => hour <= value);
        return allowed.length ? allowed[allowed.length - 1] : series[0];
      }

      function parseHour(value, series) {
        if (value == null || value === "") return null;
        const n = Number(value);
        if (!Number.isFinite(n)) return null;
        return nearestHour(n, series);
      }

      function normalizeEstimate(mode, p90) {
        let nextMode = parseHour(mode, MODE_HOURS);
        let nextP90 = parseHour(p90, P90_HOURS);
        if (nextMode != null && nextP90 != null) {
          if (nextMode > nextP90) nextP90 = nearestHour(nextMode, P90_HOURS);
          if (nextP90 < nextMode) nextMode = largestAtMost(nextP90, MODE_HOURS);
        }
        return { mode: nextMode, p90: nextP90 };
      }

      function clampRuns(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return DEFAULT_RUNS;
        const stepped = Math.round(n / 500) * 500;
        return Math.min(10000, Math.max(500, stepped));
      }

      function encodeState() {
        const json = JSON.stringify({
          v: 2,
          r: runs,
          t: tasks.map((task) => [task.name, task.mode, task.p90]),
        });
        return bytesToBase64Url(new TextEncoder().encode(json));
      }

      function decodeDocument(hash) {
        const raw = hash.startsWith("#") ? hash.slice(1) : hash;
        if (!raw) return { records: [], runs: DEFAULT_RUNS };
        try {
          const json = new TextDecoder().decode(base64UrlToBytes(raw));
          const data = JSON.parse(json);
          if (!Array.isArray(data.t)) return null;
          let records = null;
          if (data.v === 1) {
            records = data.t.map((name) => ({
              name: String(name ?? ""),
              mode: null,
              p90: null,
            }));
          } else if (data.v === 2) {
            records = data.t.map((item) => {
              const name = Array.isArray(item) ? item[0] : item?.n;
              const mode = Array.isArray(item) ? item[1] : item?.m;
              const p90 = Array.isArray(item) ? item[2] : item?.p;
              return { name: String(name ?? ""), ...normalizeEstimate(mode, p90) };
            });
          }
          if (!records) return null;
          return { records, runs: clampRuns(data.r) };
        } catch {
          return null;
        }
      }

      function encodedBytes() {
        if (tasks.length === 0) return 0;
        return encodeState().length;
      }

      function renderUsage() {
        usageEl.textContent = `${encodedBytes().toLocaleString("en-US")} bytes`;
      }

      function writeHash() {
        if (applyingHash) return;
        const encoded = tasks.length === 0 ? "" : encodeState();
        const next = encoded ? `#${encoded}` : location.pathname + location.search;
        const current = encoded
          ? `${location.pathname}${location.search}#${encoded}`
          : `${location.pathname}${location.search}`;
        if (location.pathname + location.search + location.hash === current) {
          renderUsage();
          return;
        }
        history.replaceState(null, "", next);
        renderUsage();
      }

      function applyTasks(records) {
        tasks = records.map((record, index) => ({
          id: index + 1,
          name: record.name,
          mode: record.mode,
          p90: record.p90,
        }));
        nextId = tasks.length + 1;
      }

      function loadFromHash() {
        applyingHash = true;
        const doc = decodeDocument(location.hash);
        if (doc === null) {
          applyTasks([]);
          runs = DEFAULT_RUNS;
        } else {
          applyTasks(doc.records);
          runs = doc.runs;
        }
        runsSliderEl.value = String(runs);
        runsLabelEl.textContent = runs.toLocaleString("en-US");
        applyingHash = false;
      }

      function createTask(name = "") {
        return { id: nextId++, name, mode: null, p90: null };
      }

      function taskIndex(id) {
        return tasks.findIndex((task) => task.id === id);
      }

      function addTask(afterId = null) {
        const task = createTask();
        const index = afterId == null ? tasks.length - 1 : taskIndex(afterId);
        tasks.splice(index + 1, 0, task);
        render({ focusTaskId: task.id });
      }

      function deleteTask(id) {
        const index = taskIndex(id);
        if (index === -1) return;

        const [task] = tasks.splice(index, 1);
        if (undo) clearTimeout(undo.timeoutId);
        undo = {
          task,
          index,
          timeoutId: setTimeout(() => {
            undo = null;
            renderUndo();
          }, 5000),
        };

        const prev = tasks[index - 1];
        const next = tasks[index];
        if (prev) render({ focusTaskId: prev.id });
        else if (next) render({ focusTaskId: next.id });
        else render({ focusAdd: true });
      }

      function undoDelete() {
        if (!undo) return;
        const { task, index, timeoutId } = undo;
        clearTimeout(timeoutId);
        tasks.splice(index, 0, task);
        undo = null;
        render({ focusTaskId: task.id });
      }

      function renameTask(id, name) {
        const task = tasks.find((t) => t.id === id);
        if (task) task.name = name;
        writeHash();
      }

      function setMode(id, hours) {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;
        if (task.mode === hours) {
          task.mode = null;
          render();
          return;
        }
        task.mode = parseHour(hours, MODE_HOURS);
        if (task.mode != null && task.p90 != null && task.mode > task.p90) {
          task.p90 = nearestHour(task.mode, P90_HOURS);
        }
        render();
      }

      function setP90(id, hours) {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;
        if (task.p90 === hours) {
          task.p90 = null;
          render();
          return;
        }
        task.p90 = parseHour(hours, P90_HOURS);
        if (task.mode != null && task.p90 != null && task.p90 < task.mode) {
          task.mode = largestAtMost(task.p90, MODE_HOURS);
        }
        render();
      }

      function focusAdd() {
        if (tasks.length === 0) emptyStateEl.focus();
        else addTaskBottomBtn.focus();
      }

      function classifyTasks() {
        const incomplete = [];
        const ready = [];
        for (const task of tasks) {
          const named = Boolean(task.name.trim());
          const hasEstimate = task.mode != null || task.p90 != null;
          if (!named && !hasEstimate) continue;
          if (task.mode != null && task.p90 != null) ready.push(task);
          else incomplete.push(task);
        }
        return { ready, incomplete };
      }

      function missingLabel(task) {
        const name = task.name.trim() || "Untitled task";
        const needMode = task.mode == null;
        const needP90 = task.p90 == null;
        if (needMode && needP90) return `${name} (Mode and P90)`;
        if (needMode) return `${name} (Mode)`;
        return `${name} (P90)`;
      }

      function fitLogNormal(mode, p90) {
        if (!(mode > 0) || !(p90 > 0) || p90 < mode) return null;
        if (p90 === mode) return { mu: Math.log(mode), sigma: 0 };
        const logRatio = Math.log(p90 / mode);
        const sigma = (-Z90 + Math.sqrt(Z90 * Z90 + 4 * logRatio)) / 2;
        const mu = Math.log(mode) + sigma * sigma;
        return { mu, sigma };
      }

      function randomNormal() {
        let u = 0;
        let v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }

      function sampleLogNormal(mu, sigma) {
        if (sigma === 0) return Math.exp(mu);
        return Math.exp(mu + sigma * randomNormal());
      }

      function percentile(sorted, p) {
        if (sorted.length === 0) return 0;
        const index = (sorted.length - 1) * p;
        const lo = Math.floor(index);
        const hi = Math.ceil(index);
        if (lo === hi) return sorted[lo];
        return sorted[lo] * (hi - index) + sorted[hi] * (index - lo);
      }

      function binSamples(samples, binCount = 40, maxBound = null) {
        const min = Math.min(...samples);
        const sampleMax = Math.max(...samples);
        const max = maxBound != null && maxBound > min ? maxBound : sampleMax;
        const span = max - min || 1;
        const width = span / binCount;
        const counts = Array(binCount).fill(0);
        const labels = [];
        for (let i = 0; i < binCount; i++) {
          labels.push(min + (i + 0.5) * width);
        }
        for (const value of samples) {
          if (value >= max) continue;
          let i = Math.floor((value - min) / width);
          if (i >= binCount) i = binCount - 1;
          if (i < 0) i = 0;
          counts[i] += 1;
        }
        return { labels, counts, width, max };
      }

      function simulateTotals(readyTasks) {
        const fits = readyTasks.map((task) => fitLogNormal(task.mode, task.p90));
        if (fits.some((fit) => !fit)) return [];
        const totals = [];
        for (let i = 0; i < runs; i++) {
          let sum = 0;
          for (const fit of fits) sum += sampleLogNormal(fit.mu, fit.sigma);
          totals.push(sum);
        }
        return totals;
      }

      function formatHours(value) {
        const rounded = Math.round(value * 10) / 10;
        return `${rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1)} h`;
      }

      function clearHistogram() {
        if (histogramChart) {
          histogramChart.destroy();
          histogramChart = null;
        }
        histogramWrapEl.classList.add("hidden");
        outputStatsEl.classList.add("hidden");
        outputStatsEl.classList.remove("flex");
      }

      function drawHistogram(samples, readyTasks) {
        if (typeof Chart === "undefined") {
          outputStatusEl.textContent = "Chart.js failed to load.";
          return;
        }
        const sorted = [...samples].sort((a, b) => a - b);
        const p90 = percentile(sorted, 0.9);
        const sumMode = readyTasks.reduce((sum, task) => sum + task.mode, 0);
        const sumP90 = readyTasks.reduce((sum, task) => sum + task.p90, 0);
        const { labels, counts, max: xMax } = binSamples(samples, 40, sumP90 * 1.2);
        let modeIndex = 0;
        for (let i = 1; i < counts.length; i++) {
          if (counts[i] > counts[modeIndex]) modeIndex = i;
        }
        const mode = labels[modeIndex];
        if (histogramChart) {
          histogramChart.destroy();
          histogramChart = null;
        }
        statSumModeEl.textContent = formatHours(sumMode);
        statSumP90El.textContent = formatHours(sumP90);
        statSimModeEl.textContent = formatHours(mode);
        statSimP90El.textContent = formatHours(p90);
        const chips = [
          [sumMode, statSumModeEl.closest("[data-stat]")],
          [sumP90, statSumP90El.closest("[data-stat]")],
          [mode, statSimModeEl.closest("[data-stat]")],
          [p90, statSimP90El.closest("[data-stat]")],
        ];
        chips.sort((a, b) => a[0] - b[0]);
        for (const [, chip] of chips) outputStatsEl.append(chip);
        outputStatsEl.classList.remove("hidden");
        outputStatsEl.classList.add("flex");
        outputStatusEl.textContent = `${runs.toLocaleString("en-US")} runs`;
        histogramWrapEl.classList.remove("hidden");
        histogramChart = new Chart(histogramEl, {
          type: "bar",
          data: {
            datasets: [
              {
                data: labels.map((hour, i) => ({ x: hour, y: counts[i] })),
                backgroundColor: "rgb(15 23 42 / 0.75)",
                hoverBackgroundColor: "rgb(15 23 42 / 0.9)",
                borderRadius: 2,
                barPercentage: 1,
                categoryPercentage: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            parsing: false,
            plugins: {
              legend: { display: false },
              annotation: {
                annotations: {
                  modeLine: {
                    type: "line",
                    xMin: mode,
                    xMax: mode,
                    borderColor: "rgb(37 99 235)",
                    borderWidth: 2,
                    label: { display: true, content: "Mode", position: "start" },
                  },
                  p90Line: {
                    type: "line",
                    xMin: p90,
                    xMax: p90,
                    borderColor: "rgb(220 38 38)",
                    borderWidth: 2,
                    label: { display: true, content: "P90", position: "start" },
                  },
                },
              },
            },
            scales: {
              x: {
                type: "linear",
                max: xMax,
                title: { display: true, text: "Hours" },
                ticks: { maxTicksLimit: 12 },
                grid: { display: false },
              },
              y: {
                title: { display: true, text: "Runs" },
                beginAtZero: true,
                ticks: { precision: 0 },
              },
            },
          },
        });
      }

      function renderOutput() {
        const { ready, incomplete } = classifyTasks();
        const canSimulate = ready.length > 0 && incomplete.length === 0;
        resimulateBtn.disabled = !canSimulate;

        if (tasks.length === 0 || (ready.length === 0 && incomplete.length === 0)) {
          outputStatusEl.textContent = "Add a task and set Mode and P90 to see a forecast.";
          clearHistogram();
          return;
        }
        if (incomplete.length > 0) {
          outputStatusEl.textContent = `Finish estimates before simulating: ${incomplete.map(missingLabel).join("; ")}.`;
          clearHistogram();
          return;
        }
        drawHistogram(simulateTotals(ready), ready);
      }

      function setRuns(value, { simulate = false } = {}) {
        runs = clampRuns(value);
        runsSliderEl.value = String(runs);
        runsLabelEl.textContent = runs.toLocaleString("en-US");
        writeHash();
        if (simulate) renderOutput();
      }

      function renderUndo() {
        const visible = Boolean(undo);
        undoToastEl.classList.toggle("hidden", !visible);
        undoToastEl.classList.toggle("flex", visible);
        if (undo) {
          const name = undo.task.name.trim();
          undoMessageEl.textContent = name ? `Deleted “${name}”.` : "Deleted untitled task.";
        }
      }

      function trashIcon() {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "1.75");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        svg.classList.add("h-4", "w-4");
        svg.innerHTML =
          '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>';
        return svg;
      }

      function fibGroup(task, kind) {
        const hours = kind === "mode" ? MODE_HOURS : P90_HOURS;
        const selected = kind === "mode" ? task.mode : task.p90;
        const title = kind === "mode" ? "Mode" : "P90";
        const isSet = selected != null;
        const row = document.createElement("div");
        row.className = "flex w-[15.5rem] gap-1";
        row.setAttribute("role", "group");
        row.setAttribute(
          "aria-label",
          `${title} for ${task.name.trim() || "untitled task"}`,
        );

        for (const hour of hours) {
          const pressed = hour === selected;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.tabIndex = -1;
          btn.textContent = String(hour);
          btn.setAttribute("aria-pressed", String(pressed));
          btn.className = pressed
            ? `inline-flex h-8 min-w-8 items-center justify-center rounded-md bg-slate-900 px-1.5 text-sm font-medium text-white ${focusRingOnDark}`
            : isSet
              ? `inline-flex h-8 min-w-8 items-center justify-center rounded-md bg-transparent px-1.5 text-sm font-medium text-slate-300 hover:bg-slate-100 hover:text-slate-700 ${focusRing}`
              : `inline-flex h-8 min-w-8 items-center justify-center rounded-md bg-slate-100 px-1.5 text-sm font-medium text-slate-600 hover:bg-slate-200 ${focusRing}`;
          btn.addEventListener("click", () => {
            if (kind === "mode") setMode(task.id, hour);
            else setP90(task.id, hour);
          });
          row.append(btn);
        }

        return row;
      }

      function render(options = {}) {
        const { focusTaskId = null, focusAdd: shouldFocusAdd = false } = options;
        taskListEl.replaceChildren();
        const hasTasks = tasks.length > 0;
        emptyStateEl.classList.toggle("hidden", hasTasks);
        tasksHeadingEl.classList.toggle("hidden", hasTasks);
        columnHeadersEl.classList.toggle("hidden", !hasTasks);
        addTaskBottomBtn.classList.toggle("hidden", !hasTasks);

        for (const task of tasks) {
          const li = document.createElement("li");
          li.dataset.taskId = String(task.id);
          li.className =
            "grid items-center gap-x-8 px-4 py-3 [grid-template-columns:minmax(28rem,1fr)_auto_auto]";

          const nameWrap = document.createElement("div");
          nameWrap.className = "min-w-0 border-r border-slate-100 pr-6";

          const input = document.createElement("input");
          input.type = "text";
          input.value = task.name;
          input.placeholder = "Task name";
          input.autocomplete = "off";
          input.className = `w-full min-w-0 rounded-md border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-slate-400 ${focusRing}`;
          input.addEventListener("input", (event) => {
            renameTask(task.id, event.target.value);
          });
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              const index = taskIndex(task.id);
              const isLast = index === tasks.length - 1;
              if (!task.name.trim() && isLast) return;
              if (!task.name.trim()) {
                const next = taskListEl.querySelector(
                  `[data-task-id="${tasks[index + 1].id}"] input`,
                );
                if (next) next.focus();
                return;
              }
              addTask(task.id);
              return;
            }
            if (event.key === "Backspace" && task.name === "") {
              event.preventDefault();
              deleteTask(task.id);
            }
          });

          nameWrap.append(input);

          const estimates = document.createElement("div");
          estimates.className = "flex gap-8";
          estimates.append(fibGroup(task, "mode"), fibGroup(task, "p90"));

          const label = task.name.trim() ? `Delete ${task.name}` : "Delete untitled task";
          const actions = document.createElement("div");
          actions.className = "flex w-10 items-center justify-center border-l border-slate-100 pl-3";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.tabIndex = -1;
          remove.setAttribute("aria-label", label);
          remove.className = `inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-slate-400 hover:bg-red-50 hover:text-red-600 ${focusRing}`;
          remove.append(trashIcon());
          remove.addEventListener("click", () => deleteTask(task.id));
          actions.append(remove);

          li.append(nameWrap, estimates, actions);
          taskListEl.append(li);
        }

        renderUndo();

        if (focusTaskId != null) {
          const input = taskListEl.querySelector(`[data-task-id="${focusTaskId}"] input`);
          if (input) input.focus();
        } else if (shouldFocusAdd) {
          focusAdd();
        }

        writeHash();
        renderOutput();
      }

      addTaskBottomBtn.addEventListener("click", () => addTask());
      emptyStateEl.addEventListener("click", () => addTask());
      undoDeleteBtn.addEventListener("click", undoDelete);
      resimulateBtn.addEventListener("click", () => renderOutput());
      runsSliderEl.addEventListener("input", () => setRuns(runsSliderEl.value));
      runsSliderEl.addEventListener("change", () => setRuns(runsSliderEl.value, { simulate: true }));
      document.querySelector("main").addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (event.target === event.currentTarget) return;
        event.preventDefault();
        event.target.blur();
      });
      window.addEventListener("hashchange", () => {
        loadFromHash();
        render();
      });
      loadFromHash();
      render();
    </script>
  </body>
</html>
